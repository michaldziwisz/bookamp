name: Build Bookamp (Winamp DSP, Windows x86)

# Dwa sposoby uruchomienia:
#  1. Recznie (zakladka Actions -> "Run workflow") -> wtyczka + instalator jako
#     artefakty do pobrania (wymaga zalogowania).
#  2. Push tagu wersji (np. v1.0.0) -> GitHub buduje ORAZ publikuje publiczny
#     Release. Zasoby Release hostuje i serwuje GitHub; pobiera je kazdy bez
#     logowania. To GitHub, nie autor, dystrybuuje zbudowana binarke.

"on":
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # potrzebne do utworzenia Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out sources (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSVC (x86) to PATH
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build SoundTouch (static, x86, /MT)
        shell: cmd
        run: |
          cmake -S third_party\soundtouch -B third_party\soundtouch\build_x86 -A Win32 -T v143 ^
            -DBUILD_SHARED_LIBS=OFF -DINTEGER_SAMPLES=OFF -DSOUNDSTRETCH=OFF -DSOUNDTOUCH_DLL=OFF ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_DEFAULT_CMP0091=NEW
          cmake --build third_party\soundtouch\build_x86 --config Release -j

      - name: Build Bungee (static, x86, /MT)
        shell: cmd
        run: |
          cmake -S third_party\bungee -B third_party\bungee\build_x86 -A Win32 -T v143 ^
            -DBUNGEE_BUILD_SHARED_LIBRARY=OFF ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_DEFAULT_CMP0091=NEW
          cmake --build third_party\bungee\build_x86 --config Release --target bungee_library -j

      - name: Build plugin (dsp_bookamp.dll)
        shell: cmd
        run: |
          if not exist build mkdir build
          set ST=third_party\soundtouch
          set BG=third_party\bungee
          set LIBS=%ST%\build_x86\Release\SoundTouch.lib %BG%\build_x86\Release\bungee.lib %BG%\build_x86\Release\pffft.lib
          rc /nologo /fo build\bookamp.res src\bookamp.rc
          cl /nologo /LD /O2 /MT /EHsc /std:c++20 /W3 /D_USE_MATH_DEFINES ^
            /Isrc /I%ST%\include /I%BG% /I%BG%\submodules\eigen ^
            src\dsp_bookamp.cpp src\processor.cpp src\gui.cpp src\shortcuts.cpp src\settings.cpp ^
            src\enhance.cpp src\engine_soundtouch.cpp src\engine_bungee.cpp src\engine_factory.cpp ^
            build\bookamp.res ^
            /Fe:build\dsp_bookamp.dll /Fo:build\ ^
            /link /DEF:src\dsp_bookamp.def %LIBS% user32.lib gdi32.lib comctl32.lib oleacc.lib oleaut32.lib
          dir build\dsp_bookamp.dll

      - name: Derive version from tag
        id: ver
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME:-v0.0.0-dev}"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Build installer (Inno Setup)
        shell: cmd
        run: |
          choco install innosetup --no-progress -y
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ^
            /DMyVersion=${{ steps.ver.outputs.version }} ^
            /DPluginDll=..\build\dsp_bookamp.dll ^
            installer\bookamp.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bookamp-x86
          path: |
            build/dsp_bookamp.dll
            installer/bookamp-setup-v*.exe

      - name: Publish Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dsp_bookamp.dll
            installer/bookamp-setup-v*.exe
          generate_release_notes: true
